name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Build API package
        working-directory: api
        run: |
          npm ci
          npm test
          npm prune --omit=dev
          zip -r "${RUNNER_TEMP}/api.zip" dist host.json package.json package-lock.json node_modules .funcignore

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        shell: bash
        run: |
          deployment_name="mug-collection-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.prod.bicepparam \
            --only-show-errors

          function_name="$(az deployment group show \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.outputs.application.value.functionAppName \
            --output tsv)"
          static_web_app_name="$(az deployment group show \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.outputs.application.value.staticWebAppName \
            --output tsv)"

          echo "function_name=$function_name" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$static_web_app_name" >> "$GITHUB_OUTPUT"

      - name: Deploy API
        run: |
          az functionapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infrastructure.outputs.function_name }}" \
            --src "${RUNNER_TEMP}/api.zip" \
            --only-show-errors

      - name: Get ephemeral SWA upload token
        id: swa
        shell: bash
        run: |
          token="$(az staticwebapp secrets list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infrastructure.outputs.static_web_app_name }}" \
            --query properties.apiKey \
            --output tsv)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true
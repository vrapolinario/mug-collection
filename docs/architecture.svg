<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">V&amp;M Coffee Mug Collection architecture</title>
  <desc id="description">Visitors and administrators use an Azure Static Web Apps frontend linked to an Azure Functions API. The API uses managed identity to access Azure Table Storage, private Blob Storage, and Azure Maps. GitHub Actions deploys through Azure Resource Manager using OIDC. Application Insights sends telemetry to Log Analytics.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#242424" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#495057"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#287a57"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5c2d91"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e67700"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0c8599"/></marker>
    <style>
      .title { font: 700 30px "Segoe UI", sans-serif; fill: #242424; }
      .subtitle { font: 400 15px "Segoe UI", sans-serif; fill: #5c5c5c; }
      .section { font: 700 14px "Segoe UI", sans-serif; fill: #495057; letter-spacing: 1.2px; }
      .box-title { font: 700 18px "Segoe UI", sans-serif; fill: #242424; text-anchor: middle; }
      .box-copy { font: 400 15px "Segoe UI", sans-serif; fill: #495057; text-anchor: middle; }
      .label { font: 600 13px "Segoe UI", sans-serif; fill: #495057; text-anchor: middle; }
      .mono { font: 600 13px Consolas, monospace; fill: #495057; text-anchor: middle; }
      .note { font: 600 15px "Segoe UI", sans-serif; fill: #242424; text-anchor: middle; }
      .box { filter: url(#shadow); stroke-width: 2; }
      .flow { fill: none; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#ffffff"/>
  <text class="title" x="50" y="55">V&amp;M Coffee Mug Collection architecture</text>
  <text class="subtitle" x="50" y="84">Keyless runtime access, private collection data, and manually approved deployments</text>

  <text class="section" x="50" y="175">RUNTIME FLOW</text>

  <rect class="box" x="50" y="245" width="190" height="115" rx="8" fill="#f1f3f5" stroke="#495057"/>
  <text class="box-title" x="145" y="292">Visitors</text>
  <text class="box-copy" x="145" y="321">Administrators</text>

  <rect class="box" x="345" y="125" width="250" height="90" rx="8" fill="#e8daef" stroke="#5c2d91"/>
  <text class="box-title" x="470" y="164">Microsoft Entra ID</text>
  <text class="box-copy" x="470" y="190">Built-in admin sign-in</text>

  <rect class="box" x="345" y="245" width="250" height="115" rx="8" fill="#dff6dd" stroke="#287a57"/>
  <text class="box-title" x="470" y="290">Azure Static Web Apps</text>
  <text class="box-copy" x="470" y="320">React + Vite frontend</text>

  <rect class="box" x="710" y="245" width="265" height="115" rx="8" fill="#dff6dd" stroke="#287a57"/>
  <text class="box-title" x="842.5" y="282">Azure Functions FC1</text>
  <text class="box-copy" x="842.5" y="310">Node.js 22 API</text>
  <text class="box-copy" x="842.5" y="335">User-assigned identity</text>

  <rect class="box" x="1110" y="125" width="265" height="100" rx="8" fill="#cfe4fa" stroke="#0078d4"/>
  <text class="box-title" x="1242.5" y="166">Azure Table Storage</text>
  <text class="box-copy" x="1242.5" y="195">Mugs + admin allow-list</text>

  <rect class="box" x="1110" y="255" width="265" height="100" rx="8" fill="#cfe4fa" stroke="#0078d4"/>
  <text class="box-title" x="1242.5" y="296">Private Blob Storage</text>
  <text class="box-copy" x="1242.5" y="325">Images + function packages</text>

  <rect class="box" x="1110" y="385" width="265" height="100" rx="8" fill="#cfe4fa" stroke="#0078d4"/>
  <text class="box-title" x="1242.5" y="426">Azure Maps Gen2</text>
  <text class="box-copy" x="1242.5" y="455">Map tiles + geocoding</text>

  <path class="flow" d="M245 302 H338" stroke="#495057" marker-end="url(#arrow-gray)"/>
  <text class="label" x="292" y="282">HTTPS</text>
  <path class="flow" d="M470 220 V238" stroke="#5c2d91" marker-end="url(#arrow-purple)"/>
  <path class="flow" d="M600 302 H703" stroke="#287a57" marker-end="url(#arrow-green)"/>
  <text class="mono" x="652" y="282">/api</text>

  <path class="flow" d="M980 280 H1035 V175 H1103" stroke="#0078d4" marker-end="url(#arrow-blue)"/>
  <path class="flow" d="M980 305 H1103" stroke="#0078d4" marker-end="url(#arrow-blue)"/>
  <path class="flow" d="M980 330 H1035 V435 H1103" stroke="#0078d4" marker-end="url(#arrow-blue)"/>
  <text class="label" x="1037" y="240">Managed identity</text>
  <text class="label" x="1037" y="258">RBAC</text>

  <text class="section" x="50" y="565">DEPLOYMENT + OBSERVABILITY</text>

  <rect class="box" x="50" y="610" width="260" height="105" rx="8" fill="#fff4ce" stroke="#e67700"/>
  <text class="box-title" x="180" y="646">GitHub Actions</text>
  <text class="box-copy" x="180" y="674">Manual production approval</text>
  <text class="box-copy" x="180" y="697">OIDC authentication</text>

  <rect class="box" x="390" y="610" width="245" height="105" rx="8" fill="#fff4ce" stroke="#e67700"/>
  <text class="box-title" x="512.5" y="646">Azure Resource Manager</text>
  <text class="box-copy" x="512.5" y="674">Bicep infrastructure</text>
  <text class="box-copy" x="512.5" y="697">Code deployment</text>

  <rect class="box" x="710" y="610" width="265" height="105" rx="8" fill="#d3f3f6" stroke="#0c8599"/>
  <text class="box-title" x="842.5" y="652">Application Insights</text>
  <text class="box-copy" x="842.5" y="683">API telemetry</text>

  <rect class="box" x="1110" y="610" width="265" height="105" rx="8" fill="#d3f3f6" stroke="#0c8599"/>
  <text class="box-title" x="1242.5" y="652">Log Analytics</text>
  <text class="box-copy" x="1242.5" y="683">Centralized diagnostics</text>

  <path class="flow" d="M315 662 H383" stroke="#e67700" marker-end="url(#arrow-orange)"/>
  <path class="flow" d="M470 605 V368" stroke="#e67700" stroke-dasharray="8 7" marker-end="url(#arrow-orange)"/>
  <path class="flow" d="M640 650 H670 V370 H703" stroke="#e67700" stroke-dasharray="8 7" marker-end="url(#arrow-orange)"/>
  <path class="flow" d="M842 365 V603" stroke="#0c8599" marker-end="url(#arrow-teal)"/>
  <text class="label" x="885" y="493">Telemetry</text>
  <path class="flow" d="M980 662 H1103" stroke="#0c8599" marker-end="url(#arrow-teal)"/>

  <rect x="50" y="770" width="1325" height="62" rx="8" fill="#f1f3f5" stroke="#919191"/>
  <text class="note" x="712.5" y="807">Security: no stored deployment secret, no Storage shared keys, no public blobs, and no Azure Maps local authentication</text>
</svg>
